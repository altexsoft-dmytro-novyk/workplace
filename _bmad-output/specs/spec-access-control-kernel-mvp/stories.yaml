    CAP-8 scenarios for DEC-UM-007 normalization, canonical storage, and
    exact-one active root eligibility at the real seed entrypoint.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Scenario prose only. Cite SPEC CAP-8, AD-1, spine AD-4, FR-AMD-1, DEC-UM-007
    in docs/architecture/user-management-test-decisions.md, and
    testing-strategy.md. The subject is services/backend/prisma/seed.ts invoked
    by `npm run db:seed`, which CREATES and validates the root User so a fresh
    migrated database is satisfiable with no unnamed prerequisite. Cover
    trim/lowercase normalization, STORING the normalized value so storage is
    canonical, matching on the normalized value, and exactly one active User
    whose normalized workEmail equals the normalized ROOT_WORK_EMAIL, including
    a database that already holds unrelated active employees. Cover the ORDER
    explicitly: count ALL normalized matches first and check active state only
    afterwards, so a count other than one fails as unmatched or ambiguous before
    isActive is consulted — include two rows differing only in case with one
    inactive. Cover blank, unmatched, ambiguous, and inactive root identity
    failing with actionable diagnostics; a normalized match that is not the
    intended root being neither adopted, mutated, nor reactivated; and
    concurrent runs converging through the users_workEmail_key unique violation,
    a re-read, and re-validation with no partial state. Author no permission, policy, grant, or attachment scenario, no
    User Management API/CRUD scenario, and nothing from User Management Story
    1.1's population import. Stop before tests or code.

