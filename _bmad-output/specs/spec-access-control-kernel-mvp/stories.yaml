    was recorded. Cover CROSS-TYPE COLLISION: an AR policy carrying
    targetRole='hr-admin' is legal under the partial FR unique index and is a
    different object, never adopted, mutated, counted, or reported as drift.
    Cover ALL THIRTEEN CAP-3 invariants enumerated in database-schema.md,
    including row shapes, the partial FR unique key, Permissions.key uniqueness,
    the permission-first index, UserPolicies integrity, and ON DELETE RESTRICT
    delete behavior. Follow the FR-AMD-1 field-by-field drift
    table for restore, preserve, and fail behavior. Show the prose and stop
    before tests or code.

