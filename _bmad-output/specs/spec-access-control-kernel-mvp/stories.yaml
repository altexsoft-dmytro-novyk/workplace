- id: "ACM-9-baseline"
  title: "ACM-9 — 500-target PostgreSQL baseline gate"
  description: >-
    Depends only on ACF-1 and executes before ACM-8. Pass or fail CAP-7 against
    real migrated PostgreSQL without changing resolver behavior.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Measurement and evidence only. Follow the operational sequence in
    docs/architecture/testing-strategy.md with Reporting, direct PP, Colleague,
    and mixed fixtures under ACM9-MVP-v1. Reserve the append-only baseline
    artifact, then finalize it to
    PASS/FAIL/INCOMPLETE with protocol, fixture, and environment hashes under
    ACM9-MANIFEST-v1; a finalization failure leaves the reserved INCOMPLETE
    artifact and exits nonzero. Reserve BEFORE every fallible step — fixture
    construction, database connection, and manifest hashing included — writing
    hashes in as computed, so a failure while probing still leaves an auditable
    artifact with its stop_reason. Finalize a connection failure, query error,
    or fixture-setup failure as INCOMPLETE with an error_class: never PASS and
    never FAIL. Stop immediately on the first warm-p95/worst
    value over two seconds or statement timeout; a recorded breach or timeout is
    FAIL regardless of any manifest mismatch. Only a PASS baseline satisfies
    the baseline dependency: a FAIL or INCOMPLETE baseline halts dispatch of
    ACM-8 and ACM-9-final and opens separately AD-1-gated remediation, and a
    rerun that omits the failing shape does not supersede it.

- id: "ACM-3-scenarios"
  title: "ACM-3 Stage 1 — inactive and missing identity scenario prose"
  description: >-
    Depends on ACF-1. Author only CAP-1 scenarios for inactive or missing
    viewers, targets, Reporting bridges, and PP endpoints, including mixed,
    duplicate-target, and empty bulk input.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Scenario prose only. Cite SPEC CAP-1, architecture AD-1, the Access Control
    spine AD-1, docs/architecture/access-control.md, and
    docs/architecture/testing-strategy.md in every scenario dispatch. Prove that
    viewer identity validation precedes ALL audience derivation including Self,
    and that Self is exclusive only after both viewer and target are confirmed
    present and active; define one result per distinct target
    with duplicates collapsing to one key; and cover an empty target list
    returning an empty map with no relationship-graph read, preserving the
    inherited Phase-0 short-circuit. Prove path-local visited state and
    shared-ancestor validity, and prove that reaching the viewer is provisional
    and does not by itself grant Reporting: cover a repeated node before viewer
    proof and a repeated node after it, including a viewer that is itself inside
    a cycle, and show each denies Reporting for that target only while valid
    Self and direct PP paths remain. Separate the two termination cases
    explicitly: an ABSENT manager edge is a clean end, while an edge whose
    ENDPOINT IS INACTIVE is unusable and treated as absent — denying Reporting
    before viewer proof and granting it after viewer proof, with nothing above
    the dead node reachable. Call out explicitly that the after-viewer-proof
    GRANT is a behavior CHANGE, not a restatement: the current recursive CTE
    joins users.isActive in both terms and stops at an inactive node, so it
    would deny that case today. The scenario must state the before/after, so a
    reviewer approves a widening knowingly rather than reading it as existing
    behavior. Do NOT author a missing-endpoint-row scenario: it
    is unreachable under relationships_shape_check plus the ON DELETE RESTRICT
    endpoint foreign key, so record it as a defensive invariant instead. Do NOT
    author soft-deleted User or bridge scenarios: User has no soft-delete
    column. Due behavior is deferred; stop before tests.

