  invoke_dev_with: >-
    Cite SPEC CAP-3, AD-1, spine AD-4, FR-AMD-1, database-schema.md, and
    testing-strategy.md. Treat the CAP-8 root User as an existing precondition
    rather than ACM-1 work. The subject entrypoint is
    src/access-control/infrastructure/bootstrap/access-control-bootstrap.ts via
