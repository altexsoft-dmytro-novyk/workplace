# AD-1 historical-decision ledger — Access Control Kernel MVP
#
# `approvals` is append-only historical evidence from the withdrawn AD-1 gate;
# its entries are never edited, removed, or used to authorize or block a stage.
# A separately typed `ratifications` list may record a late classification of
# already-completed out-of-order work. It records non-compliance and is never a
# clean gate pass or a stage-transition authorization.
#
# Historical `approvals` schema — every entry carries all nine fields:
#
#   - story_id:      dispatch entry id from stories.yaml (e.g. "ACM-0-scenarios")
#     stage:         stage-1-scenarios | stage-2-tests | stage-3-production
#     repo:          workspace | services/backend
#     artifact_path: path to the artifact, relative to THAT repo's root
#     commit:        revision in THAT repo at which the artifact was read
#     author:        who produced the artifact
#     approver:      who approved it
#     decision:      historical approved | rejected decision
#     timestamp:     ISO-8601, e.g. 2026-09-01T14:03:00Z
#
# `repo` exists because this workspace spans two git repositories: planning
# artifacts live here, while tests and production code live in the
# `services/backend` submodule. A bare revision cannot say which one it belongs
# to, and an approval nobody can resolve is not verifiable — the exact failure
# this ledger was introduced to prevent.
#
# Late `ratifications` schema — every entry carries: story_id, stage, repo,
# artifact_path, commit, author, ratifier, ratified_at, evidence, rationale,
# and disposition: recorded-late-not-gated. `author != ratifier`; `commit` and
# `artifact_path` must resolve in `repo`. The record can classify only work
# already completed before `ratified_at`; it cannot validate that ordering.
#
# Verify a record before relying on it — `repo` selects the working directory,
# so the check is unambiguous:
#   repo: workspace         -> git -C . cat-file -e <commit>:<artifact_path>
#   repo: services/backend  -> git -C services/backend cat-file -e <commit>:<artifact_path>
# A record whose commit does not resolve, or whose artifact_path is absent at
# that commit, is not independently verifiable and must not be ratified.
#
# Status: historical ACM-3-scenarios and ACM-1-scenarios records are retained
# below. They describe decisions that were made; they do not gate any next
# dispatch under the withdrawn AD-1 approval rule.

