- id: "UMAC-1-scenarios"
  title: "UMAC-1 Stage 1 — port rebind + READ route adoption scenario prose"
  description: >-
    Depends on human acceptance of um-integration-contract-response.md and this
    SPEC. Author only scenario prose for CAP-1 (real facade-backed
    ACCESS_CONTROL_PORT adapter in src/user-management/infrastructure/,
    interim adapter deleted), the READ half of CAP-2 (GET /users/:id
    feature -> audience mapping: self / reporting / pp / colleague all allowed
    over an active target; unresolved session -> 401, authenticated active
    viewer with empty audience -> 403), and CAP-3 (the { data, canEdit }
    envelope replacing toUserResponse's whole-row spread on GET /users/:id —
    data = the 12 S1 fields, canEdit = the read-only dual-gate hint, false for
    all until user-management:edit is seeded).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    services/backend only. Scenario prose only — no test, no production code,
    stop for independent human approval. Cite this SPEC, AD-2 and AD-21 in
    architecture-people-management-2026-08-19/ARCHITECTURE-SPINE.md, AD-3 in
    architecture-access-control-foundation-2026-08-29/ARCHITECTURE-SPINE.md,
    docs/architecture/access-control.md (denial conventions, matrix exceptions,
    §3.2 S1 = R for Colleague, §3.3.4), docs/architecture/nestjs-di-tokens.md
    (guards are the only sanctioned port consumer; actions never inject ports),
    docs/architecture/testing-strategy.md, and um-integration-contract-response.md
    Q1/Q2/Q4/Q5/Q6. Write line-by-line actor -> request -> expected outcome
    scenarios for: GET /users/:id as Self (200, S1 card); as a reporting-line
    viewer with a direct Relationship edge to the target (200, S1 card); as
    the target's assigned people_partner (200, S1 card); as an unrelated
    active session / colleague (200, the SAME S1 card — §3.2 S1 row is R for
    the Colleague column, every active authenticated viewer is at least a
    Colleague); a request whose session does not resolve to an active User
    (401 — the session layer's job; note the interim resolver is lax); an
    authenticated active viewer whose audience over the target is empty
    (403 — target not an active User; no existence distinction). The body is
    the envelope { data, canEdit }. data is: id, firstName, lastName, photo,
    position, country, city, workEmail, workPhone, birthDay, birthMonth,
    companyJoinDate; data DROPS ttId, isActive, customFields, createdAt,
    createdBy; derived S1 display fields (manager, people partner, department,
    mentor, current projects) are out of scope for this route until those
    contexts land and data omits them. canEdit = isAllowed(viewer,
    user-management:edit) && canAccessSection(viewer, 'S1', target) ===
    'write' — false for every viewer now (edit permission unseeded; colleague
    permanently false by section access). Include: isAllowed for user-management:create /
    :deactivate / :list still allows the seeded HR-Admin root and denies
    others (delegated straight to AccessControlFacade.isAllowed);
    interim-access-control.adapter.ts is deleted, not left beside the real one
    (AD-21). State the CAP-3 change in the scenario doc: Story 0.1 adds a
    dedicated { data, canEdit } mapper on the GET /users/:id handler ONLY (the
    GET /users list, POST /users, PATCH /users/:id, DELETE /users/:id and PUT
    /users/:id/photo response bodies are unchanged by this slice; rolling the
    envelope onto the other section/detail routes is its own planning item);
    the FURTHER narrowing (S10 dates-only, S11 name-only, S16 per-field) stays
    FR-17. Do
    NOT author write-path (PATCH / PUT photo) scenarios here — those are
    UMAC-2. Do NOT author scenarios that touch Access Control files, prisma
    schema, migrations, or seed.

- id: "UMAC-1-red-tests"
  title: "UMAC-1 Stage 2 — real-consumer HTTP READ E2E (committed red)"
  description: >-
    Depends on independent human approval of UMAC-1 Stage 1. Translate only the
    approved scenarios into a committed-red real-consumer HTTP E2E suite under
    services/backend/test/user-management/, exercising real router, session
    guard, AccessControlGuard, real AccessControlFacade, real Prisma, migrated
    PostgreSQL — no provider overrides (AD-3 consumer rule).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    services/backend only. Stage-2 test code only — commit red, stop for
    independent human approval, change no production code. Before starting,
    record and verify the UMAC-1-scenarios Stage-1 approval in this package's
    approvals.yaml (story_id, stage, repo, artifact_path, commit, author,
    approver, decision, timestamp; author != approver; commit resolves and
    artifact present). Seed real User rows and real Relationship rows (a direct
    edge for the reporting case, a people_partner edge for the PP case, viewer
    id == target id for Self, an unrelated active user for the colleague
    case) and issue Bearer <token:<seeded-uuid>> headers, which
    InterimSessionResolverAdapter accepts unchanged — do NOT use literal
    persona placeholders for the cases that need a real audience. One test per
    approved scenario, scenario id in the test title. Assert every read case
    (self / reporting / pp / colleague) as 200 with body { data, canEdit }:
    data has exactly the 12 S1 fields (ttId / customFields / createdBy /
    createdAt / isActive ABSENT), and canEdit === false for all four (colleague
    by section access, the rest by the unseeded edit permission). Assert the
    empty-audience denial (authenticated active viewer, inactive/missing
    target) as 403. The suite must FAIL until
    UMAC-1-production rebinds the port and ships the { data, canEdit } mapper
    (the interim adapter returns Boolean(userId) and toUserResponse spreads the
    whole row with no envelope, so the shape, absent-technical-field and 403
    assertions are red).
    Follow
    .claude/rules/nest-e2e.md. Note whether the four existing
    profile.e2e-spec.ts cases (um-pf-01..04) need real personas or a tightened
    scope note, and surface that for human decision — do not silently rewrite
    that suite beyond keeping it green.

- id: "UMAC-1-production"
  title: "UMAC-1 Stage 3 — rebind ACCESS_CONTROL_PORT to the real adapter"
  description: >-
    Depends on independent human approval of the committed-red UMAC-1 Stage-2
    suite. Implement the CAP-1 adapter + rebind, the READ half of CAP-2, and
    the CAP-3 { data, canEdit } envelope on the GET /users/:id handler only (a
    dedicated mapper, not a rewrite of the shared toUserResponse); make the
    approved tests pass.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    services/backend only. Production code only. Before starting, record and
    verify the UMAC-1-red-tests Stage-2 approval in this package's
    approvals.yaml (author != approver; commit resolves; artifact present).
    Create src/user-management/infrastructure/access-control-facade.adapter.ts:
    @Injectable(), injects AccessControlFacade, implements AccessControlPort.
    isAllowed(userId, feature) delegates directly to
    AccessControlFacade.isAllowed(userId, feature). isAllowedForTarget(userId,
    feature, targetUserId) for feature 'user-management:read': call
    AccessControlFacade.resolveAudiences(userId, [targetUserId]) and allow when
    the target's audience set is NON-EMPTY (any of 'self', 'reporting', 'pp',
    or 'colleague' — every active viewer over an active target is at least a
    Colleague and §3.2 S1 is R for Colleague); an EMPTY set (target not an
    active User) denies. An authenticated active viewer with an empty audience
    gets 403 — this is exactly what AccessControlGuard already produces from a
    denied isAllowedForTarget, so NO guard or controller change is needed. A
    request whose session does not resolve to an active User is 401 (session
    layer); the interim resolver is lax, so such a request may reach the guard
    and surface as 403 — acceptable during the interim. No "leak-free 404"
    (human product decision 2026-09-01).
    On the GET /users/:id handler ONLY, return the envelope { data, canEdit }
    via a dedicated response mapper (do NOT rewrite the shared toUserResponse
    in place). data = exactly id, firstName, lastName, photo, position,
    country, city, workEmail, workPhone, birthDay, birthMonth, companyJoinDate
    — and NOT ttId, isActive, customFields, createdAt, createdBy. canEdit =
    (await AccessControlFacade.isAllowed(userId, EDIT_USER_FEATURE)) &&
    (await AccessControlFacade.canAccessSection(userId, 'S1', targetUserId))
    === 'write' — a read-only hint computed on the GET; enforcement stays on
    PATCH (UMAC-2). EDIT_USER_FEATURE ('user-management:edit') is not seeded,
    so isAllowed fails closed and canEdit is false for every viewer now; that
    is correct and expected — the Stage-2 suite asserts canEdit === false.
    Wire the computation in the adapter/handler; do NOT add the edit route or
    permission. Leave the GET /users list, POST /users,
    PATCH /users/:id, DELETE /users/:id, and PUT /users/:id/photo response
    bodies exactly as they are today. Rebind
    ACCESS_CONTROL_PORT in user-management.module.ts to the new adapter and
    DELETE interim-access-control.adapter.ts (AD-21 — no dual-running). Do NOT
    add a route, change AccessControlPort's signatures, inject the facade
    anywhere except this adapter, touch any Access Control file, or touch
    prisma schema/migrations/seed. GUARD NOTE: AccessControlGuard already maps
    a denied isAllowedForTarget to 403, which is the intended denial for this
    route — do NOT change AccessControlGuard or add a NotFound branch. Do NOT
    implement PATCH / PUT photo behaviour (UMAC-2). Run npm run lint,
    npx tsc --noEmit, and the user-management + access-control e2e suites;
    the pre-existing not-yet-built /users/:id/relationships failures are
    unrelated and must be identical before and after.

