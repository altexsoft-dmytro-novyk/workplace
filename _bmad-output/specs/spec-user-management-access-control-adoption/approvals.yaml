# AD-1 stage-approval ledger — User Management ↔ Access Control Adoption
#
# Append-only. A superseding decision is APPENDED; no entry is ever edited or
# removed. This file is the persisted, independently verifiable form of the
# AD-1 gate: a claim in a report that "a human approved this" is not an
# approval, this record is.
#
# Schema — every entry carries all eight fields:
#
#   - story_id:      dispatch entry id from stories.yaml (e.g. "UMAC-1-scenarios")
#     stage:         stage-1-scenarios | stage-2-tests | stage-3-production
#     repo:          workspace | services/backend
#     artifact_path: path to the artifact, relative to THAT repo's root
#     commit:        revision in THAT repo at which the artifact was read
#     author:        who produced the artifact
#     approver:      who approved it
#     decision:      approved | rejected
#     timestamp:     ISO-8601, e.g. 2026-09-01T14:03:00Z
#
# `repo` exists because this workspace spans two git repositories: planning
# artifacts live here, tests and production code live in `services/backend`.
#
# Rules that make the record enforceable:
#   1. author != approver (no self-certification).
#   2. A dispatch may not start until the PRIOR stage's record exists and
#      VERIFIES — `commit` resolves and `artifact_path` is present at it.
#
# Verify:
#   repo: workspace         -> git -C . cat-file -e <commit>:<artifact_path>
#   repo: services/backend  -> git -C services/backend cat-file -e <commit>:<artifact_path>
#
