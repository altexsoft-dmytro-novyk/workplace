    evidence:
      - services/backend/src/user-management/user-management.module.ts:34
      - services/backend/src/user-management/infrastructure/magic-link-dispatcher.fake.ts
    rescope_reason: >
      The previous wording described the fake as scoped, which the module binding
      contradicts. Severity raised because the deviation is present in the production
      composition rather than confined to the test seam.
