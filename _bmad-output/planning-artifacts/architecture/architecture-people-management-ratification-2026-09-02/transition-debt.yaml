version: 2
baseline_date: 2026-09-02
revision: 2026-09-02-reviewer-gate-correction
policy:
  meaning: Dated implementation deviation from a ratified target decision
  retirement_rule: Retire only with linked, independently approved production evidence
  severity_rule: >
    Severity reflects the consequence if the deviation reaches a shared environment, not
    the effort to retire it. A deviation that defeats an authorization invariant is P0
    even while it is latent.
items:
  - id: TD-01
    severity: P0
    deviation: User Management binds InterimAccessControlAdapter; target checks can allow any resolved user
    decisions: [AD-6, AD-9, AD-12, AD-21]
    owner: UM-E0-S0.1
    expiry_trigger: UMAC-1 reaches approved production and the interim adapter is removed
    evidence: services/backend/src/user-management/user-management.module.ts
  - id: TD-02
    severity: P0
    previous_severity: P1
    rescoped: 2026-09-02-reviewer-gate-update
    deviation: >
      InterimSessionResolverAdapter, bound into the production module, accepts any
      fixture-style bearer identity AND self-provisions a privileged account. A request
      carrying Bearer <token:Root> against a database with no seeded root creates a User
      row with position 'HR Admin', which InterimAccessControlAdapter then grants
      user-management:create, user-management:deactivate, and user-management:list.
    decisions: [AD-12, AD-15, AD-16, AD-21]
    previous_decisions: [AD-15, AD-21]
    owner: UM-E2
    expiry_trigger: Magic-link session implementation reaches approved production
    deploy_gate: >
      Must fail closed or be removed from the production module before the backend is
      deployed to any shared environment. This gate is independent of the expiry trigger.
    exposure: >
      Latent, not live. The backend is not containerized in docker-compose.yml and is not
      deployed, so there is no exploitable surface today.
    blocker: SEC-AUTH-01
    evidence:
      - services/backend/src/user-management/infrastructure/interim-session-resolver.adapter.ts:43-48
      - services/backend/src/user-management/infrastructure/interim-session-resolver.adapter.ts:74-87
      - services/backend/src/user-management/infrastructure/interim-access-control.adapter.ts:11-14
      - services/backend/src/user-management/user-management.module.ts
    status_note: >
      2026-09-03: implementation evidence for the blocker's fix exists on the
      unmerged dn-um-implementation branch — see blockers.yaml SEC-AUTH-01
      status_note for detail. Not merged, not independently verified; this entry's
      severity and deploy_gate are unchanged until then.
    rescope_reason: >
      The previous description covered only the persona-token path and omitted root
      self-provisioning entirely, which is the part that bypasses the Access Control
      spine's bootstrap contract and contradicts AD-12's stated Prevents and AD-16's
      no-provisioning-API rule.
  - id: TD-03
    severity: P1
    deviation: Legacy POST /users and DELETE /users/:id remain available
    decisions: [AD-14, AD-16, AD-21]
    owner: UM-E1
    expiry_trigger: Seeded-import and departure cutover removes both legacy product operations
    evidence: services/backend/src/user-management/application/controllers/users.controller.ts
  - id: TD-04
    severity: P0
    rescoped: 2026-09-02-reviewer-gate-update
    deviation: >
      The whole-row toUserResponse serializer is applied by every User handler, not only
      GET /users/:id, so a broader User shape than the target S1 envelope is returned by
      six routes including the GET /users list. Independently, the target-scoped
      authorization behind three of those routes is unconditional: isAllowedForTarget
      returns Boolean(userId) regardless of feature or target, so PATCH /users/:id and
      PUT /users/:id/photo are as ungated as GET /users/:id.
    previous_deviation: GET /users/:id serializes a broader User shape than the target S1 envelope
    decisions: [AD-12, AD-14, AD-21]
    owner: UM-E0-S0.1
    expiry_trigger: >
      The S1 projection reaches approved production on ALL six affected routes, AND
      target-scoped authorization is real on all three target-scoped routes. Retiring this
      item on the UMAC-1 slice alone is insufficient: that slice scopes the S1 projection
      to the GET /users/:id handler, which would leave five whole-row routes - including
      the GET /users list - still emitting non-S1 fields under a retired P0.
    previous_expiry_trigger: UMAC-1 S1 projection reaches approved production
    expiry_trigger_corrected: 2026-09-02-reviewer-gate-update
    affected_routes:
      - GET /users
      - POST /users
      - GET /users/:id
      - PATCH /users/:id
      - PUT /users/:id/photo
      - DELETE /users/:id
    ungated_target_routes:
      - GET /users/:id
      - PATCH /users/:id
      - PUT /users/:id/photo
    evidence:
      - services/backend/src/user-management/application/dtos/user.response.ts
      - services/backend/src/user-management/application/controllers/users.controller.ts:65
      - services/backend/src/user-management/application/controllers/users.controller.ts:76
      - services/backend/src/user-management/application/controllers/users.controller.ts:84
      - services/backend/src/user-management/application/controllers/users.controller.ts:90
      - services/backend/src/user-management/application/controllers/users.controller.ts:104
      - services/backend/src/user-management/application/controllers/users.controller.ts:112
      - services/backend/src/user-management/infrastructure/interim-access-control.adapter.ts:37
    rescope_reason: >
      The previous scope was read-only and single-route. Both narrowings understated the
      risk relative to the spine this package ratifies, which already recorded the
      unconditional target check. POST /users and DELETE /users/:id are additionally
      covered by TD-03 as legacy operations.
