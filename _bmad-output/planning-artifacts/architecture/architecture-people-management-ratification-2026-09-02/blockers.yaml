  - id: SEC-AUTH-01
    owner: Architect and Security
    severity: P0
    blocks:
      - Deployment of interim adapters to any shared environment
      - AD-12 privilege-escalation invariant
      - AD-16 no-provisioning-API invariant
    status: open
    evidence:
      - services/backend/src/user-management/infrastructure/interim-session-resolver.adapter.ts:43-48
      - services/backend/src/user-management/infrastructure/interim-session-resolver.adapter.ts:74-87
      - services/backend/src/user-management/infrastructure/interim-access-control.adapter.ts:11-14
      - services/backend/src/user-management/infrastructure/interim-access-control.adapter.ts:37
      - services/backend/src/user-management/user-management.module.ts
    closure_condition: Interim adapters fail closed, or are removed from the production module
    note: >
      Three compounding paths, all bound into the production module. (1) Any
      "Bearer <token:persona>" resolves to a session. (2) The "Root" persona
      self-provisions a User row with position 'HR Admin' when no root exists, which
      the interim access-control adapter then grants user-management:create,
      :deactivate, and :list. (3) isAllowedForTarget returns Boolean(userId) for every
      target check. This bypasses the AC-spine bootstrap contract and contradicts
      AD-12 and AD-16.
    exposure: >
      Latent, not live. The backend is not containerized in docker-compose.yml and is
      not deployed, so there is no exploitable surface today. That is a reason to
      sequence the fix before the first shared-environment deploy, not a reason to
      downgrade it. Tracked as transition debt TD-02, re-scoped to P0.
    status_note: >
      Implementation evidence exists on the unmerged `dn-um-implementation` branch
      (services/backend): both interim-session-resolver.adapter.ts and
      interim-access-control.adapter.ts are deleted. jwt-session-resolver.adapter.ts
      replaces the session resolver (real JWT verification; the
      `Bearer <token:persona>` shorthand and `Root` self-provisioning survive only
      behind ALLOW_TEST_SESSION_TOKENS, refused in production).
      access-control-facade.adapter.ts replaces isAllowedForTarget with a real
      per-feature audience/section check. Not merged into main or this docs branch;
      not through this project's own verification process (cf. QUALITY-GATE-AC's
      gate-decision.json). Status stays open until merged and independently
      verified. Recorded 2026-09-03 via bmad-correct-course to pre-empt a
      stale-status merge conflict.

      Correction, 2026-09-03: the `note` above is partly stale for the backend
      this docs branch itself points at (gitlink 25afb15), not only for
      dn-um-implementation. Verified there: path (3) is closed —
      interim-access-control.adapter.ts is deleted by this branch's own commit
      979f225 and access-control-facade.adapter.ts implements isAllowedForTarget
      with real audience resolution for reads and fail-closed for write-path
      target features. Path (2) is half closed — the Root persona still creates
      the position 'HR Admin' User row, but the automatic grant of
      user-management:create|deactivate|list is gone, because isAllowed now
      delegates to the real FR grant chain with no User.position shortcut.
      Path (1) is live and unchanged: interim-session-resolver.adapter.ts is
      still present, so any `Bearer <token:persona>` resolves to a session.
      Status stays open on path (1) alone. The two
      interim-access-control.adapter.ts entries in `evidence` no longer resolve
      at 25afb15; they are kept because they still resolve at the pre-979f225
      revisions the original assessment was written against.

