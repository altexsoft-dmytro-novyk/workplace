  - id: TT-IDENTITY-01
    owner: Architect and Integration owner
    severity: P0
    blocks: [TimeTracker project-member sync, AD-13 ttId identity rule, project-line audience derivation]
    status: open
    supersedes_part_of: TIMETRACKER-CONTRACT
    evidence:
      - docs/integrations/timetracker-external-api.json
      - _bmad-output/planning-artifacts/architecture/architecture-people-management-2026-08-19/ARCHITECTURE-SPINE.md#AD-13
      - docs/project-requirements.md
    closure_condition: >
      An approved durable identity source for project members, or an approved amendment
      to the AD-13 identity rule
    note: >
      Project members arrive as AccountTalentDto {email, dateStart, dateEnd} with no
      durable id, while requirements state email alone is insufficient and AD-13 builds
      User.ttId on that premise. The seed CSV is also keyed by email with no id column.
      User.ttId therefore has no population source, and the only available join is the
      one the requirements forbid. A durable Employee.id exists but only on the
      Accounting endpoint, behind a different partner key, requiring month and year and
      returning only employees with time entries in that period; using it as an identity
      bridge needs an explicit approved decision, not an inference.

