# Dimensions this altitude owns that no AD covers. A dimension left silent is a finding,
# not a clean spine; recording it here gives it an owner without amending either spine.
dimensions:
  - id: operational-envelope
    added: 2026-09-02-reviewer-gate-update
    owner: Architect
    design: open
    implementation: absent
    blocker: OPERATIONAL-ENVELOPE
    covers:
      - Hosting provider
      - Environment topology
      - Observability vendor and alert ownership
      - Manual retry surface
      - BUSINESS_TIME_ZONE validation across environments
      - Worker process topology
      - Rollback position
      - Secret management for external integration keys
    evidence:
      - _bmad-output/planning-artifacts/architecture/architecture-people-management-2026-08-19/ARCHITECTURE-SPINE.md:196
      - _bmad-output/planning-artifacts/architecture/architecture-people-management-2026-08-19/ARCHITECTURE-SPINE.md:316
      - docs/integrations/timetracker-external-api.json
    note: >
      Previously silent across all four package files. AD-20's operational release gate
      requires that every deployed environment validate the same businessTimeZone, run at
      least one worker against the same PostgreSQL source, expose health signals for
      oldest-due lag, retry-wait count, and expired or reclaimed leases, and demonstrate
      alert ownership and a manual retry surface before release. AD-20 classifies mixed
      process configuration as a startup or deployment failure, so divergence here is a
      runtime failure mode. Recording the dimension as open with an owner is not a
      readiness claim and does not certify deployment.
  - id: frontend-architecture
    added: 2026-09-02-batch-architecture-update
    owner: Architect
    design: ratified
    implementation: transition-debt
    ad: AD-25
    blocker: null
    transition_debt: [TD-11]
    covers:
      - Backend projection as sole authorization source of truth
      - No client-side role or access matrices
      - Server-provided capabilities such as canEdit
      - Permission-sensitive query cache semantics
      - Installed React/Vite/Router/TanStack/Axios/Tailwind/shadcn/i18n stack
    evidence:
      - _bmad-output/planning-artifacts/architecture/architecture-people-management-2026-08-19/ARCHITECTURE-SPINE.md#AD-25
      - services/frontend/src/main.tsx:13
      - services/frontend/package.json
    note: >
      Design approved 2026-09-02. The global five-minute staleTime is recorded as
      TD-11, not as the target. This is not a release-readiness claim.
