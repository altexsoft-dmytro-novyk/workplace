      PLAT-E7 covers the two non-audience paths — the §3.2 Shared link column and the
      PM/AD-28 read-only full-profile overlay.
      GATE REGISTRATION CLOSED 2026-09-03: AC-SECTION-MATRIX-01 is now registered in
      blockers.yaml and owns S2-S8 and S14-S16; AC-S9-S13 owns S9, S12 and S13, its blocks:
      list having been corrected to name S12 explicitly. This requirement owns the whole
      section matrix and therefore carries both gates. Closing AC-S9-S13 unblocks S9, S12 and
      S13 only and must not be reported as unblocking any AC-SECTION-MATRIX-01 section.
      PM-FR-3 cannot reach implemented while PLAT-E6-S6.6 (S16) is open, and S6.6 is
