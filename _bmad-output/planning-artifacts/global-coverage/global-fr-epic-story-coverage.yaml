    epics: [PLAT-E3, PLAT-E8, UM-E0]
    notes: >
      Kernel separation exists; real consumer adoption remains incomplete.
      PLAT-E8-S8.1 carries one FR-1 testable consequence only — that holding the DM or PM
      functional role grants no Project-line tier without a project attachment. It does not
      cover FR-1 as a whole. UM-E0-S0.1 remains the adoption owner.
      2026-09-02 CE quality pass: story ID and sprint_key recorded; AC converted to
      Given/When/Then in platform/epics.md. SD-1 freeze of E2/E3 is unchanged.
