      - {id: PLAT-E5-S5.2, sprint_key: 5-2-fail-closed-department-walk, status: specified}
      - {id: PLAT-E5-S5.3, sprint_key: 5-3-people-partner-hr-line-bounded-by-ishr, status: specified}
      - {id: PLAT-E8-S8.1, sprint_key: 8-1-project-line-derivation-from-explicit-pm-dm-attachments, status: specified}
      - {id: PLAT-E8-S8.2, sprint_key: 8-2-project-line-column-narrowness-and-best-column-merge, status: specified}
      - {id: PLAT-E8-S8.3, sprint_key: 8-3-project-derived-revocation-and-timetracker-outage-withdrawal, status: specified}
      - {id: PLAT-E8-S8.4, sprint_key: 8-4-project-membership-is-read-only-to-access-control, status: specified}
    epics: [PLAT-E2, PLAT-E3, PLAT-E5, PLAT-E8]
    gates: [DEPARTMENT-EDGE, TT-IDENTITY-01, TT-PMDM-01, ARCH-PROJ-WRITER-01]
    notes: >
      Reporting/direct-PP Phase-0 exists; department, project, and PP HR-line are not complete.
      Live TimeTracker gates are TT-IDENTITY-01 and TT-PMDM-01. TIMETRACKER-CONTRACT is
      superseded historical only.
      2026-09-02 decomposition: PLAT-E8 covers project-line derivation, column narrowness,
      revocation timing and the AD-31 read-only membership boundary; PLAT-E5 covers the
      department walk and isHr-bounded PP HR-line. Neither epic can close its own blocking
      gate, so PM-FR-2 stays in-progress on their completion and must not be promoted to
      implemented: TT-IDENTITY-01 leaves User.ttId with no population source, so no
      Relationship type='project' row can be legitimately created, and DEPARTMENT-EDGE
      requires the PM/AD-35 schema, which has no owning story in any slice.
      ARCH-PROJ-WRITER-01 added as a gate here resolving the open question raised by
      review-cross-slice-seams-2026-09-02 V-05 (whether it gates PM-FR-2 or PM-FR-37):
      project-line audience derivation depends on membership rows whose sole approved
      writer does not exist.
      PLAT-E2-S2.1 status conflict: sprint-status.yaml records
      2-1-resolve-phase-0-audiences-acf-1 as done. Left as in-progress here pending Platform
      Story 1.1 reconciliation rather than silently flipped.
