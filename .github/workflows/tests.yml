name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Node 24 is what services/backend/.nvmrc pins; the frontend has no .nvmrc and
  # runs on the same major.
  SERVICE_NODE_VERSION: '24'

jobs:
  # Also blocking. This only runs the readiness-map scripts' unit tests (scripts/*.cjs) — the
  # actual map for this run is built later, inside the `live-verification` job, from that run's
  # real evidence.
  readiness-map:
    name: Workspace · readiness map (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:readiness

  # ── Blocking gate ────────────────────────────────────────────────────────
  # The workspace ClickUp sync suite is green today and stays a real gate.
  clickup:
    name: Workspace · ClickUp sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:clickup

  # Also blocking. The trace-gate threshold contract is a workspace suite with
  # no service dependencies, so it gates from the start. It guards the
  # customization the quality gate resolves its thresholds from:
  # .agents/skills/bmad-testarch-trace/customize.toml carries a
  # "DO NOT EDIT -- overwritten on every update" header, so a skill update that
  # drops the threshold defaults would otherwise surface only at gate time, on
  # the run that needed the gate.
  trace-gate:
    name: Workspace · trace gate thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:trace-gate

  # ── Service suites ───────────────────────────────────────────────────────
  # Two of the three now gate. `backend-unit` (19/19) and `frontend-e2e`
  # (124/124, no flaky cases) were observed green on a run at the currently
  # pinned service SHAs — backend 20ed2a08, frontend cfbed35 — so they run
  # without `continue-on-error` and a red result there is a real failure.
  #
  # `backend-e2e` stays informational. AD-1 commits Stage-2 tests red on
  # purpose: the test lands before the production code, and mentorship
  # (~29 cases) has no module under src/ at all. `continue-on-error` keeps that
  # job's conclusion neutral so no branch protection rule can block a merge on a
  # red the process asked for. Promote it the same way once its suite is meant
  # to be green — but note it carries four `continue-on-error` lines, not two:
  # job level plus the compose, migration and test steps. All four have to go,
  # because a soft step that fails still counts as successful when the job's
  # conclusion is computed.
  #
  # The `Lint` steps of the two gating jobs are deliberately still soft; lint
  # has not been promoted.

  backend-unit:
    name: Backend · unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # services/* are private submodules; the default GITHUB_TOKEN cannot
          # clone another private repo. SUBMODULES_TOKEN is a PAT with `repo`
          # scope on backend + frontend.
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.SERVICE_NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/backend/package-lock.json

      - name: Install
        run: npm ci # postinstall runs `prisma generate`

      - name: Prepare report directory
        run: mkdir -p "$GITHUB_WORKSPACE/reports"

      - name: Lint
        continue-on-error: true
        # Not `npm run lint`: that script carries `--fix`, so in CI it would
        # rewrite files on the runner, exit 0 for every autofixable rule and
        # throw the fixes away with the workspace.
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests
        run: npm test -- --ci --json --outputFile="$GITHUB_WORKSPACE/reports/backend-unit.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-backend-unit
          path: reports/backend-unit.json
          if-no-files-found: warn
          retention-days: 30

  backend-e2e:
    name: Backend · e2e (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.SERVICE_NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/backend/package-lock.json

      - name: Materialise .env for docker compose
        # docker-compose.yml declares `env_file: .env`, which is gitignored. The
        # committed template carries every value the compose stack needs except
        # the LocalStack token, which is a repository secret.
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          cp .env.example .env
          if [ -n "$LOCALSTACK_AUTH_TOKEN" ]; then
            # Security: secret passed through env: to prevent script injection
            printf '\nLOCALSTACK_AUTH_TOKEN=%s\n' "$LOCALSTACK_AUTH_TOKEN" >> .env
          else
            echo "::warning::LOCALSTACK_AUTH_TOKEN secret is not set — LocalStack will not start and S3-backed specs will fail."
          fi

      - name: Start Postgres + LocalStack
        continue-on-error: true
        run: docker compose up -d --wait

      - name: Install
        run: npm ci

      - name: Prepare report directory
        run: mkdir -p "$GITHUB_WORKSPACE/reports"

      - name: Apply migrations
        # Soft, like the compose step above it: when the database never came up
        # the e2e suite should still run and report red, because a red report is
        # evidence and a skipped step is a hole in it.
        continue-on-error: true
        run: npm run db:deploy

      - name: E2E tests
        continue-on-error: true
        run: npm run test:e2e -- --ci --json --outputFile="$GITHUB_WORKSPACE/reports/backend-e2e.json"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-backend-e2e
          path: reports/backend-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop containers
        if: always()
        run: docker compose down -v

  frontend-e2e:
    name: Frontend · Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.SERVICE_NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Prepare report directory
        run: mkdir -p "$GITHUB_WORKSPACE/reports"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The browser build is pinned by the @playwright/test version, so the
          # lockfile hash is the correct key.
          key: playwright-${{ runner.os }}-${{ hashFiles('services/frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        # `--with-deps` installs OS libraries outside the cached directory, so it
        # runs on a cache hit too; only the browser download is skipped.
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        # The suite mocks the API at the network layer and starts Vite itself
        # (playwright.config.ts `webServer`), so no backend is needed here.
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/reports/frontend-e2e.json
        run: npm test -- --reporter=list,json,html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-frontend-e2e
          path: reports/frontend-e2e.json
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: services/frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ── Performance NFR ──────────────────────────────────────────────────────
  # ACM9 is the only performance suite that can actually fail: it asserts
  # `expect(firstBreach).toBeNull()` against a 2 s absolute budget per gate.
  # P6 (`measure:access-control:p6`) is deliberately measurement-only
  # (`performanceThresholdAssertionsAdded: false`) — it records timings and
  # asserts nothing about them, so a job for it could never go red on a
  # regression. It is left out here on purpose rather than wired as a gate that
  # cannot fail.
  #
  # `--role baseline` is the role that belongs in CI. The breach check runs for
  # either role, but `--role final` additionally compares against a prior
  # artifact whose `environment_manifest_hash` covers node version, platform,
  # CPU count and total memory — so a baseline recorded on any other machine can
  # never be `comparable` on a runner, and final would finalize INCOMPLETE
  # instead of PASS. Baseline needs no prior artifact and still fails on a real
  # breach.
  #
  # Informational on purpose, and not a step on the way to gating. The only
  # shape that can breach the budget is the deep acyclic chain: locally depth
  # 499 sits at ~987 ms of the 2 s limit, while depth 5-50 — the range a real
  # org chart lives in, since a person has on the order of 5-10 managers above
  # them — costs 9-12 ms, about 0.5% of the budget. A blocking gate here would
  # therefore go red on a graph shape the product cannot produce, and stay
  # silent about the range that actually ships. The `continue-on-error` lines
  # below (job level plus the measurement step) are not a TODO.
  #
  # To make this gate mean something, narrow the protocol's depth sequence to
  # realistic values rather than promoting this job. That is a new protocol
  # version, not a tweak: `acyclic_depths` is hashed into
  # `fixture_manifest_hash`, so changing it makes every existing baseline
  # incomparable.
  backend-acm9:
    name: Backend · ACM9 access-control NFR (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.SERVICE_NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/backend/package-lock.json

      - name: Materialise .env for docker compose
        # Only Postgres is started below, so the LocalStack token is not needed.
        run: cp .env.example .env

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run db:deploy

      - name: ACM9 measurement
        continue-on-error: true
        run: npm run measure:access-control:acm9 -- --role baseline

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-backend-acm9
          # The suite writes to the workspace root, not under services/backend;
          # `path` is workspace-relative regardless of working-directory.
          path: _bmad-output/test-artifacts/performance/acm9-*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop containers
        if: always()
        run: docker compose down -v

  # ── Evidence aggregation ─────────────────────────────────────────────────
  # Turns the three runs into the file /bmad-testarch-trace reads as `live`
  # evidence, which is what moves a trace run out of `contract_static`.
  live-verification:
    name: Live verification evidence
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-e2e, frontend-e2e]
    if: always()
    steps:
      - uses: actions/checkout@v5
        # The workspace alone carries docs/test-cases/** (the oracle) and
        # _bmad-output/test-artifacts/** (the coverage matrix). Submodules are
        # not needed: the reports already name their own files.

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: report-*
          merge-multiple: true

      - name: Build live-verification-results.json
        id: evidence
        # `git rev-parse HEAD` on a pull_request event resolves to the ephemeral
        # merge commit, which no local trace run will ever match. The branch head
        # is the commit a reviewer actually has checked out.
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The producer is piped into tee, and the default shell is `bash -e`
          # without pipefail — without this line the step would take tee's exit
          # code and a crashed producer would report as green with no evidence.
          set -o pipefail
          # Security: event context passed through env: to prevent script injection
          SOURCE_SHA="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          node scripts/build-live-verification-results.cjs \
            --jest reports/backend-unit.json --suite backend-unit \
            --jest reports/backend-e2e.json --suite backend-e2e \
            --playwright reports/frontend-e2e.json --suite frontend-e2e \
            --source-sha "$SOURCE_SHA" \
            --producer "GitHub Actions · $RUN_URL" \
            | tee summary.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Live verification evidence'
            echo
            echo 'Backend unit and Frontend Playwright are gating: a red result there fails the run.'
            echo 'Backend e2e stays informational — its red is AD-1 by design and blocks nothing.'
            echo
            echo '```'
            cat summary.txt 2>/dev/null || echo 'producer did not run'
            echo '```'
            echo
            echo 'Download the `live-verification-results` artifact into'
            echo '`_bmad-output/test-artifacts/` and re-run `/bmad-testarch-trace`'
            echo 'to trace against observed evidence instead of `contract_static`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-verification-results
          path: _bmad-output/test-artifacts/live-verification-results.json
          if-no-files-found: warn
          retention-days: 30

      # The readiness map is a demo report built from evidence already uploaded above. A bug in
      # this tooling must never fail the job that actually collected the test evidence, so every
      # step below is continue-on-error — same convention as the informational jobs elsewhere in
      # this file.
      - name: Install readiness map dependencies
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        continue-on-error: true
        run: npm ci

      - name: Build readiness map from this run
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        continue-on-error: true
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          node scripts/build-readiness-map.cjs \
            --sha "${PR_HEAD_SHA:-${GITHUB_SHA}}" \
            --out reports/readiness-map/index.html
          echo 'Readiness map: download the `workplace-readiness-map` artifact and open index.html.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        continue-on-error: true
        with:
          name: workplace-readiness-map
          path: reports/readiness-map/index.html
          if-no-files-found: error
          retention-days: 30
