name: Advisory PR code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_call:
    inputs:
      repository:
        description: Repository containing the pull request
        required: true
        type: string
      base_sha:
        description: Pull request base commit
        required: true
        type: string
      head_sha:
        description: Pull request head commit
        required: true
        type: string
      pull_request_number:
        description: Pull request number
        required: true
        type: number
      checkout_path:
        description: Workspace-relative path for the service checkout
        required: true
        type: string
    secrets:
      CURSOR_API_KEY:
        required: true
      SUBMODULES_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: advisory-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Generate advisory findings
    if: inputs.repository != '' || github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    env:
      REVIEW_REPOSITORY: ${{ inputs.repository || github.repository }}
      BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
      TARGET_PATH: ${{ inputs.checkout_path || '.' }}
    steps:
      - name: Initialize neutral report
        run: |
          mkdir -p .pr-review
          cat > .pr-review/report.md <<'EOF'
          ## Automated review

          Review preparation did not complete. No findings were produced.
          EOF

      - name: Validate review target
        id: target
        env:
          SERVICE_REPOSITORY: ${{ inputs.repository }}
        run: |
          if [ -z "$SERVICE_REPOSITORY" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          elif [ "$SERVICE_REPOSITORY" = "altexsoft-dmytro-novyk/backend" ] &&
               [ "$TARGET_PATH" = "services/backend" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unsupported reusable review target; advisory review was skipped."
            cat > .pr-review/report.md <<'EOF'
          ## Automated review

          The reusable caller requested an unsupported repository or checkout path. No findings were produced and no merge gate was applied.
          EOF
          fi

      - name: Check reviewer credentials
        id: credentials
        if: steps.target.outputs.valid == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CURSOR_API_KEY is not configured; advisory review was skipped."
            cat > .pr-review/report.md <<'EOF'
          ## Automated review

          Reviewer credentials are unavailable. The advisory review was skipped; no merge gate was applied.
          EOF
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout workspace pull request
        id: workspace-pr
        if: steps.target.outputs.valid == 'true' && steps.credentials.outputs.available == 'true' && inputs.repository == ''
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout workspace review assets
        id: workspace-assets
        if: steps.target.outputs.valid == 'true' && steps.credentials.outputs.available == 'true' && inputs.repository != ''
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: altexsoft-dmytro-novyk/workplace
          ref: main
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Checkout service pull request
        id: service-pr
        if: steps.target.outputs.valid == 'true' && steps.credentials.outputs.available == 'true' && inputs.repository != ''
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.head_sha }}
          path: ${{ inputs.checkout_path }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare filtered three-dot diff
        id: diff
        if: steps.target.outputs.valid == 'true' && steps.credentials.outputs.available == 'true'
        env:
          REVIEW_KIND: ${{ inputs.repository != '' && 'service' || 'workspace' }}
          MAX_FILE_LINES: '1500'
          WORKSPACE_PR_CHECKOUT: ${{ steps.workspace-pr.outcome }}
          WORKSPACE_ASSETS_CHECKOUT: ${{ steps.workspace-assets.outcome }}
          SERVICE_PR_CHECKOUT: ${{ steps.service-pr.outcome }}
        run: |
          set -u
          mkdir -p "$GITHUB_WORKSPACE/.pr-review"

          if { [ "$REVIEW_KIND" = "workspace" ] &&
               [ "$WORKSPACE_PR_CHECKOUT" != "success" ]; } ||
             { [ "$REVIEW_KIND" = "service" ] &&
               { [ "$WORKSPACE_ASSETS_CHECKOUT" != "success" ] ||
                 [ "$SERVICE_PR_CHECKOUT" != "success" ]; }; }; then
            echo "::warning::A required repository checkout failed; advisory review was skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            cat > "$GITHUB_WORKSPACE/.pr-review/report.md" <<'EOF'
          ## Automated review

          A required repository checkout failed. No findings were produced and no merge gate was applied.
          EOF
            exit 0
          fi

          if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
             [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::warning::Pull request SHAs are missing or invalid; advisory review was skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            cat > "$GITHUB_WORKSPACE/.pr-review/report.md" <<'EOF'
          ## Automated review

          The pull request commit range was invalid. No findings were produced and no merge gate was applied.
          EOF
            exit 0
          fi

          if ! cd "$TARGET_PATH" ||
             ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
             ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "::warning::The pull request commit range is unavailable; advisory review was skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            cat > "$GITHUB_WORKSPACE/.pr-review/report.md" <<'EOF'
          ## Automated review

          The pull request commit range was unavailable after checkout. No findings were produced and no merge gate was applied.
          EOF
            exit 0
          fi

          pathspec=(.)
          if [ "$REVIEW_KIND" = "workspace" ]; then
            pathspec+=(
              ':(exclude).tmp/**'
            )
          fi

          range="$BASE_SHA...$HEAD_SHA"
          if ! git diff --no-ext-diff --numstat -z --diff-filter=ACDMRT \
              "$range" -- "${pathspec[@]}" \
              > "$GITHUB_WORKSPACE/.pr-review/numstat.z"; then
            echo "::warning::The three-dot diff could not be generated; advisory review was skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            cat > "$GITHUB_WORKSPACE/.pr-review/report.md" <<'EOF'
          ## Automated review

          The filtered three-dot diff could not be generated. No findings were produced and no merge gate was applied.
          EOF
            exit 0
          fi

          # Cap each file's diff rather than excluding whole directories. This
          # repository's authored documents are the deliverable, but a single
          # generated artifact beside them can outweigh every one of them and
          # crowd the reviewer's context. Set aside per file, and name what was
          # set aside so the report can disclose it.
          python3 - <<'PY'
          import os
          from pathlib import Path

          cap = int(os.environ["MAX_FILE_LINES"])
          out = Path(os.environ["GITHUB_WORKSPACE"]) / ".pr-review"
          records = (out / "numstat.z").read_bytes().split(b"\0")

          skipped = []
          index = 0
          while index < len(records):
              fields = records[index].split(b"\t")
              if len(fields) != 3:
                  index += 1
                  continue
              added, deleted, name = fields
              if name:
                  index += 1
              else:
                  # A rename emits its old and new paths as the next two records.
                  name = records[index + 2]
                  index += 3
              if added == b"-" or deleted == b"-":
                  skipped.append((name, "binary"))
              elif int(added) + int(deleted) > cap:
                  skipped.append((name, f"{int(added) + int(deleted)} changed lines"))

          (out / "skipped.z").write_bytes(b"".join(name + b"\0" for name, _ in skipped))
          (out / "skipped.txt").write_text(
              "".join(
                  f"{name.decode('utf-8', 'replace')}\t{reason}\n"
                  for name, reason in skipped
              ),
              encoding="utf-8",
          )
          PY

          # ':(exclude,literal)' takes each path verbatim, so a filename holding
          # glob characters cannot widen the exclusion.
          excludes=()
          if [ -s "$GITHUB_WORKSPACE/.pr-review/skipped.z" ]; then
            mapfile -d '' -t skipped_paths \
              < "$GITHUB_WORKSPACE/.pr-review/skipped.z"
            for skipped_path in "${skipped_paths[@]}"; do
              excludes+=(":(exclude,literal)$skipped_path")
            done
          fi

          if ! git diff --no-ext-diff --name-only --diff-filter=ACDMRT \
              "$range" -- "${pathspec[@]}" "${excludes[@]}" \
              > "$GITHUB_WORKSPACE/.pr-review/files.txt"; then
            echo "::warning::The reviewable file list could not be generated; advisory review was skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            cat > "$GITHUB_WORKSPACE/.pr-review/report.md" <<'EOF'
          ## Automated review

          The reviewable file list could not be generated. No findings were produced and no merge gate was applied.
          EOF
            exit 0
          fi

          if [ ! -s "$GITHUB_WORKSPACE/.pr-review/files.txt" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo '## Automated review'
              echo
              if [ -s "$GITHUB_WORKSPACE/.pr-review/skipped.txt" ]; then
                echo "Every changed file was set aside by the ${MAX_FILE_LINES}-line per-file review cap. No findings were produced."
                echo
                echo 'Set aside:'
                echo
                while IFS=$'\t' read -r skipped_path reason; do
                  echo "- \`$skipped_path\` ($reason)"
                done < "$GITHUB_WORKSPACE/.pr-review/skipped.txt"
              else
                echo 'No reviewable paths remained after applying the repository review filter.'
              fi
            } > "$GITHUB_WORKSPACE/.pr-review/report.md"
            exit 0
          fi

          if ! git diff --no-ext-diff --unified=80 "$range" \
              -- "${pathspec[@]}" "${excludes[@]}" \
              > "$GITHUB_WORKSPACE/.pr-review/diff.patch"; then
            echo "::warning::The filtered patch could not be generated; advisory review was skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            cat > "$GITHUB_WORKSPACE/.pr-review/report.md" <<'EOF'
          ## Automated review

          The filtered patch could not be generated. No findings were produced and no merge gate was applied.
          EOF
            exit 0
          fi

          if [ ! -s "$GITHUB_WORKSPACE/.pr-review/diff.patch" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            cat > "$GITHUB_WORKSPACE/.pr-review/report.md" <<'EOF'
          ## Automated review

          The filtered code diff was empty. No findings were produced.
          EOF
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Review input"
            echo
            echo "- Repository: \`$REVIEW_REPOSITORY\`"
            echo "- Range: \`$BASE_SHA...$HEAD_SHA\`"
            echo "- Files reviewed: $(wc -l < "$GITHUB_WORKSPACE/.pr-review/files.txt")"
            echo "- Files set aside: $(wc -l < "$GITHUB_WORKSPACE/.pr-review/skipped.txt")"
            echo "- Patch lines: $(wc -l < "$GITHUB_WORKSPACE/.pr-review/diff.patch")"
          } >> "$GITHUB_STEP_SUMMARY"

      # The skill tree is the reviewer's own instructions, and on a workspace
      # pull request it arrives from the pull request itself. Take it from the
      # base branch instead, so a pull request cannot rewrite the review it is
      # about to receive. The reusable service path already checks the workspace
      # out at main, so its copy is trusted for the same reason.
      - name: Check out reviewer instructions from the base branch
        id: reviewer-assets
        if: steps.diff.outputs.ready == 'true' && inputs.repository == ''
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .agents
            .claude
          sparse-checkout-cone-mode: false
          path: .review-assets

      - name: Install Cursor CLI
        id: cursor-cli
        if: steps.diff.outputs.ready == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -u
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

          # Record what this CLI build actually accepts. The installer tracks a
          # fast-moving build, so the flags the docs describe and the flags this
          # binary takes can differ, and that difference is invisible otherwise.
          {
            echo '### Cursor CLI'
            echo
            echo '```'
            "$HOME/.cursor/bin/agent" --version 2>&1 | head -5 || true
            echo
            CURSOR_API_KEY="$CURSOR_API_KEY" \
              "$HOME/.cursor/bin/agent" --list-models 2>&1 | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run BMad review
        id: reviewer
        if: steps.diff.outputs.ready == 'true'
        timeout-minutes: 15
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REVIEW_KIND: ${{ inputs.repository != '' && 'service' || 'workspace' }}
          REVIEWER_ASSETS: ${{ steps.reviewer-assets.outcome }}
          # Leave empty to use the Cursor account's default model.
          REVIEWER_MODEL: ''
        run: |
          set -u
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::CURSOR_API_KEY is not configured; the reviewer cannot run."
            exit 1
          fi

          if [ "$REVIEW_KIND" = "workspace" ]; then
            if [ "$REVIEWER_ASSETS" != "success" ]; then
              echo "::error::The base-branch skill tree could not be checked out; refusing to review with instructions from the pull request."
              exit 1
            fi
            # Both trees carry the same skills, and the agent reaches for
            # whichever it finds. Pinning only one leaves the other as a way to
            # hand the reviewer instructions written by the pull request.
            for tree in .agents .claude; do
              if [ ! -d ".review-assets/$tree" ]; then
                echo "::error::$tree is missing from the base branch checkout; refusing to review with instructions from the pull request."
                exit 1
              fi
              rm -rf "$tree"
              mv ".review-assets/$tree" "$tree"
            done
            rm -rf .review-assets
          fi

          model_args=()
          if [ -n "$REVIEWER_MODEL" ]; then
            model_args=(--model "$REVIEWER_MODEL")
          fi

          # --plan is what makes the reviewer read-only. Print mode alone does
          # not: `agent --help` states -p "has access to all tools, including
          # write and shell", and --force only removes the approval prompt.
          # Plan mode analyses and proposes without editing, which is the whole
          # job here.
          #
          # --trust answers the workspace-trust prompt, which otherwise blocks
          # any non-interactive run. It grants no command approval of its own;
          # --force and --yolo, which would, are deliberately not passed.
          set +e
          agent -p \
            --plan \
            --trust \
            --output-format stream-json \
            "${model_args[@]}" \
            "$(cat .github/pr-review-prompt.txt)

          The reviewed repository is \`$REVIEW_REPOSITORY\` at \`$TARGET_PATH\`." \
            > "$GITHUB_WORKSPACE/.pr-review/agent-output.jsonl" \
            2> "$GITHUB_WORKSPACE/.pr-review/agent-stderr.txt"
          status=$?
          set -e

          # Keep stderr in the step's own log as well as the file. Routing it
          # only to the file left a failing step with an empty log.
          if [ -s "$GITHUB_WORKSPACE/.pr-review/agent-stderr.txt" ]; then
            echo "--- reviewer stderr ---"
            cat "$GITHUB_WORKSPACE/.pr-review/agent-stderr.txt"
            echo "--- end reviewer stderr ---"
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::The reviewer exited with status $status."
            # The CLI's own usage text names the flags this version accepts,
            # which is what a flag error needs and stderr may not carry.
            echo "--- agent --help ---"
            agent --help 2>&1 | head -60 || true
          fi
          exit "$status"

      - name: Surface reviewer diagnostics
        # Runs on success too. A reviewer that answers without doing the work
        # still succeeds, and that is precisely the case worth reading. This step
        # also extracts the reviewer's final answer, so the agent log is parsed
        # once and the publishing step below only has to judge what came out.
        if: always() && steps.diff.outputs.ready == 'true'
        run: |
          set -u
          cd "$GITHUB_WORKSPACE"

          if [ -s .pr-review/agent-stderr.txt ]; then
            {
              echo '### Reviewer stderr'
              echo
              echo '```'
              head -c 4000 .pr-review/agent-stderr.txt
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ ! -s .pr-review/agent-output.jsonl ]; then
            echo "::warning::The reviewer produced no output; its behaviour is unavailable."
            exit 0
          fi

          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          LINE_CAP = 240
          TOTAL_CAP = 200_000

          raw = Path(".pr-review/agent-output.jsonl").read_text(
              encoding="utf-8", errors="replace"
          )

          # Accept either shape without being told which: --output-format json
          # emits one object, stream-json emits one object per line.
          records = []
          try:
              parsed = json.loads(raw)
              records = parsed if isinstance(parsed, list) else [parsed]
          except json.JSONDecodeError:
              for line in raw.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      records.append(json.loads(line))
                  except json.JSONDecodeError:
                      continue

          def clip(value, cap=LINE_CAP):
              text = " ".join(str(value).split())
              return text if len(text) <= cap else text[: cap - 1] + "…"

          def blocks(entry):
              content = entry.get("message", {}).get("content", entry.get("content"))
              if isinstance(content, str):
                  return [{"type": "text", "text": content}]
              return content if isinstance(content, list) else []

          # The agent's final answer is the report. Look for it by the documented
          # `result` field first, then fall back to the last assistant text, so an
          # unfamiliar record shape costs the trace rather than the whole review.
          answer = ""
          for entry in reversed(records):
              value = entry.get("result")
              if isinstance(value, str) and value.strip():
                  answer = value
                  break
          if not answer:
              texts = [
                  block.get("text", "")
                  for entry in records
                  if entry.get("type") in {"assistant", "message"}
                  for block in blocks(entry)
                  if block.get("type") == "text"
              ]
              answer = texts[-1] if texts else ""
          Path(".pr-review/candidate.md").write_text(answer, encoding="utf-8")

          print("### Reviewer outcome")
          print()
          print("```")
          print(f"{'records:':<20}{len(records)}")
          terminal = next(
              (e for e in reversed(records) if e.get("type") in {"result", "final"}),
              None,
          )
          if terminal:
              for field in (
                  "type",
                  "subtype",
                  "is_error",
                  "error",
                  "duration_ms",
                  "num_turns",
                  "total_cost_usd",
              ):
                  if field in terminal:
                      print(f"{field + ':':<20}{clip(terminal[field], 200)}")
          else:
              print("No terminal record: the reviewer was cut off before it finished.")
          print(f"{'answer chars:':<20}{len(answer)}")
          print("```")
          print()

          print("### Reviewer trace")
          print()
          print("One line per turn: what the reviewer said, and every tool it called.")
          print()
          print("```")
          emitted = 0
          truncated = False
          for entry in records:
              rendered = []
              for block in blocks(entry):
                  btype = block.get("type")
                  if btype == "text" and block.get("text", "").strip():
                      rendered.append(f"say    {clip(block['text'])}")
                  elif btype in {"tool_use", "tool_call"}:
                      name = block.get("name", "?")
                      args = block.get("input") or block.get("arguments") or {}
                      # Surface the argument that identifies the call: a path, a
                      # command, a skill name, or the head of a subagent prompt.
                      detail = clip(json.dumps(args, ensure_ascii=False), 160)
                      for key in ("file_path", "path", "pattern", "command",
                                  "skill", "subagent_type", "prompt",
                                  "description"):
                          if isinstance(args, dict) and args.get(key):
                              detail = f"{key}={clip(args[key], 160)}"
                              break
                      rendered.append(f"call   {name}({detail})")
                  elif btype in {"tool_result", "tool_output"}:
                      flag = "ERR " if block.get("is_error") else ""
                      body = block.get("content", block.get("output"))
                      if isinstance(body, list):
                          body = " ".join(
                              part.get("text", "")
                              for part in body
                              if isinstance(part, dict)
                          )
                      rendered.append(f"result {flag}{clip(body)}")
              if not rendered and entry.get("type") not in {None, "result", "final"}:
                  # An unrecognized record still says what the agent was doing.
                  rendered.append(f"{entry.get('type'):<6} {clip(json.dumps(entry, ensure_ascii=False))}")
              for line in rendered:
                  if emitted + len(line) > TOTAL_CAP:
                      truncated = True
                      break
                  emitted += len(line)
                  print(line)
              if truncated:
                  break
          if truncated:
              print("… trace truncated; the full log is in the "
                    "bmad-pr-review-agent-log artifact.")
          if emitted == 0:
              print("The reviewer took no recorded turns.")
          print("```")
          PY

      - name: Upload reviewer agent log
        if: always() && steps.diff.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bmad-pr-review-agent-log
          path: |
            .pr-review/agent-output.jsonl
            .pr-review/agent-stderr.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Materialize reviewer response
        if: always() && steps.diff.outputs.ready == 'true'
        env:
          REVIEW_OUTCOME: ${{ steps.reviewer.outcome }}
        run: |
          set -u
          published=false

          # The diagnostics step above already pulled the reviewer's final answer
          # out of the agent log and wrote it here.
          if [ "$REVIEW_OUTCOME" = "success" ] && [ -s .pr-review/candidate.md ]; then
            published=true
          fi

          # A reviewer that restates its task instead of doing it still returns a
          # non-empty string, so a length check alone will publish that verbatim.
          # Require the headings the prompt mandates before treating the response
          # as a report — but salvage a real report wrapped in a code fence or
          # introduced by a preamble first. The gate exists to catch "this is not
          # a report", not to reject one over its packaging.
          if [ "$published" = true ]; then
            if python3 - <<'PY'; then
          import re
          import sys
          from pathlib import Path

          path = Path(".pr-review/candidate.md")
          text = path.read_text(encoding="utf-8", errors="replace")

          fence = re.match(r"\s*```[a-zA-Z]*\n(.*?)\n?```\s*\Z", text, re.DOTALL)
          if fence:
              text = fence.group(1)

          start = re.search(r"^## Automated review\s*$", text, re.MULTILINE)
          if not start or not re.search(r"^### Findings\s*$", text, re.MULTILINE):
              sys.exit(1)

          path.write_text(text[start.start():].strip() + "\n", encoding="utf-8")
          PY
              :
            else
              published=false
              echo "::error::The reviewer response is not a report; no findings were published."
              {
                echo '--- rejected reviewer response (first 2000 bytes) ---'
                head -c 2000 .pr-review/candidate.md
                echo
                echo '--- end rejected reviewer response ---'
              } | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "$published" = true ]; then
            mv .pr-review/candidate.md .pr-review/report.md
          else
            echo "::error::The reviewer returned no usable response; no findings were published."
            cat > .pr-review/report.md <<'EOF'
          ## Automated review

          The reviewer returned no usable response. No findings were published.
          EOF
            # The neutral report above is still published by the steps that follow,
            # because each of them runs under always().
            exit 1
          fi

      - name: Bound report size
        if: always()
        run: |
          if [ ! -s .pr-review/report.md ]; then
            mkdir -p .pr-review
            cat > .pr-review/report.md <<'EOF'
          ## Automated review

          The findings report was unavailable. No findings were published and no merge gate was applied.
          EOF
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".pr-review/report.md")
          limit = 60000
          suffix = b"\n\n_Report truncated to fit the pull request comment limit._\n"
          report = path.read_bytes()
          if len(report) > limit:
              prefix = report[: limit - len(suffix)].decode("utf-8", errors="ignore")
              path.write_bytes(prefix.encode("utf-8") + suffix)
          PY

      - name: Review job summary
        if: always()
        run: |
          if [ -s .pr-review/report.md ]; then
            {
              echo '<!-- bmad-code-review -->'
              cat .pr-review/report.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Automated review' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'The report was unavailable. No merge gate was applied.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload findings report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bmad-pr-review-report
          path: .pr-review/report.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  comment:
    name: Publish advisory findings
    needs: review
    if: >-
      always() && !cancelled() &&
      (
        (inputs.repository == '' && github.event.pull_request.user.type != 'Bot') ||
        (inputs.repository == 'altexsoft-dmytro-novyk/backend' && inputs.checkout_path == 'services/backend')
      )
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_REPOSITORY: ${{ inputs.repository || github.repository }}
      PR_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
    steps:
      - name: Download findings report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bmad-pr-review-report
          path: pr-review-output

      - name: Prepare comment and job summary
        run: |
          if [ ! -s pr-review-output/report.md ]; then
            mkdir -p pr-review-output
            cat > pr-review-output/report.md <<'EOF'
          ## Automated review

          The findings artifact was unavailable. No findings were published and no merge gate was applied.
          EOF
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pr-review-output/report.md")
          limit = 60000
          suffix = b"\n\n_Report truncated to fit the pull request comment limit._\n"
          report = path.read_bytes()
          if len(report) > limit:
              prefix = report[: limit - len(suffix)].decode("utf-8", errors="ignore")
              path.write_bytes(prefix.encode("utf-8") + suffix)
          PY
          {
            echo '<!-- bmad-code-review -->'
            cat pr-review-output/report.md
          } > pr-review-output/comment.md
          cat pr-review-output/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert advisory pull request comment
        run: |
          set -u
          endpoint="repos/$REVIEW_REPOSITORY/issues/$PR_NUMBER/comments"
          if ! comment_ids=$(gh api --paginate "$endpoint" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- bmad-code-review -->")) | .id'); then
            echo "::warning::Could not list pull request comments; findings remain available in the run summary."
            exit 0
          fi

          comment_id=${comment_ids%%$'\n'*}
          if [ -n "$comment_id" ]; then
            if ! gh api --method PATCH \
                "repos/$REVIEW_REPOSITORY/issues/comments/$comment_id" \
                -F body=@pr-review-output/comment.md >/dev/null; then
              echo "::warning::Could not update the advisory review comment; findings remain available in the run summary."
            fi
          elif ! gh api --method POST "$endpoint" \
              -F body=@pr-review-output/comment.md >/dev/null; then
            echo "::warning::Could not create the advisory review comment; findings remain available in the run summary."
          fi
